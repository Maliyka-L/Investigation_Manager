<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>SOC Investigation Manager</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 40px;
        }

        h1{
            color: #1f2937;
        }

        .card{
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
        }

        input,
        select{
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
        }

        button{
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }

        button:hover{
            background-color: #1d4ed8;
        }

        table{
            width:100%;
            border-collapse: collapse;
        }

        th{
            background-color: #111827;
            color: white;
        }

        th,
        td{
            border:1px solid #d1d5db;
            padding:12px;
            text-align:left;
        }

    </style>

</head>

<body>

    <h1>SOC Investigation Manager</h1>

    <div class="card">

        <h2>Create Investigation Case</h2>

        <form action="/create_case" method="POST">

            <input
                type="text"
                name="title"
                placeholder="Suspicious PowerShell Activity"
                required>

            <select name="severity">

                <option>Low</option>
                <option>Medium</option>
                <option>High</option>
                <option>Critical</option>

            </select>

            <button type="submit">
                Create Case
            </button>

        </form>

    </div>

    <div class="card">

        <h2>Investigation Queue</h2>

        <table>

            <tr>
                <th>Case ID</th>
                <th>Title</th>
                <th>Severity</th>
                <th>Status</th>
                <th>Created</th>
            </tr>

            {% for case in cases %}

            <tr>
                <td>{{ case.case_id }}</td>
                <td>{{ case.title }}</td>
                <td>{{ case.severity }}</td>
                <td>{{ case.status }}</td>
                <td>{{ case.created }}</td>
            </tr>

            {% endfor %}

        </table>

    </div>

</body>
</html>
